# Server Configuration
server.port=8086
spring.application.name=trade-matching-core

# Enable Project Loom (High Concurrency Virtual Threads)
spring.threads.virtual.enabled=true

# --- H2 Database Configuration ---
# Mode=PostgreSQL ensures better compatibility with standard SQL types
spring.datasource.url=jdbc:h2:file:./data/matching_db;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Hikari Connection Pool (Virtual Thread Optimized) ---
# We increase the pool size because virtual threads allow more concurrent I/O requests
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate Logic ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Performance: Hibernate Batching
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# --- JSON & Logging ---
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.byteentropy=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# 
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always